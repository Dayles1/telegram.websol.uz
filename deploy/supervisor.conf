; supervisord programs for telegram.websol.uz
; Copy to /etc/supervisor/conf.d/telegram-websol.conf, fix the paths/user, then:
;   supervisorctl reread && supervisorctl update && supervisorctl status
;
; Everything runs on the standard Laravel queue (database driver). Queue names start with
; "telegramWebsol" (config/telegram.php, .env TELEGRAM_QUEUE / TELEGRAM_SEND_QUEUE / DB_QUEUE):
;   1. telegram-websol-queue   -> queue "telegramWebsol": phone login steps, session checks,
;      chat history, repeat rounds
;   2. telegram-websol-sending -> queue "telegramWebsol-sending": send jobs, one account per job. numprocs = how many accounts
;      send at the same time. --max-jobs=1 gives every job a fresh process, so MadelineProto
;      state never leaks from one account to another (supervisord starts the next process).
;
; Plus cron (once): * * * * * cd /var/www/telegram.websol.uz && php artisan schedule:run >> /dev/null 2>&1
; It runs telegram:tick every minute: repairs, overdue repeat rounds, queues accounts with due
; messages, deletes files nobody will send again.

[program:telegram-websol-queue]
command=/opt/php83/bin/php /var/www/telegram.websol.uz/artisan queue:work --queue=telegramWebsol --sleep=1 --tries=1 --max-time=3600 --timeout=330
directory=/var/www/telegram.websol.uz
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=360
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/telegram.websol.uz/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:telegram-websol-sending]
; --timeout must cover the job (worker.max_runtime 240 + 120) and stay below DB_QUEUE_RETRY_AFTER (400)
command=/opt/php83/bin/php /var/www/telegram.websol.uz/artisan queue:work --queue=telegramWebsol-sending --max-jobs=1 --sleep=2 --timeout=370
directory=/var/www/telegram.websol.uz
user=www-data
numprocs=5
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
; every job ends the process on purpose: never count that as a failed start
startsecs=0
; SIGTERM: the message in hand finishes, the job goes back to the queue
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/telegram.websol.uz/storage/logs/send-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
