; supervisord program for telegram.websol.uz: the only process the project needs (no cron).
; Copy to /etc/supervisor/conf.d/telegram-websol.conf, fix the paths/user, then:
;   supervisorctl reread && supervisorctl update && supervisorctl status
;
; Everything runs as jobs on one queue, "telegramWebsol" (.env DB_QUEUE, the only place the
; name is set): phone login steps, session checks, chat history, sends, repeat rounds. The
; worker itself queues the minute tick (App\Jobs\MinuteTick): repairs, overdue repeat rounds,
; accounts with due messages, unused files, and once a day session checks / chat history /
; pruning.
;
; numprocs = TELEGRAM_SEND_SLOTS (.env, default 3: how many accounts send at the same time) + 1,
; so a process always stays free for a login code.
; --timeout covers the longest job (send: worker.max_runtime 240 + 120 = 360) and stays below
; DB_QUEUE_RETRY_AFTER (400). Jobs that set $tries / $timeout themselves keep their own values.
; --max-time=3600: every process is replaced once an hour (MadelineProto memory stays bounded).

[program:telegram-websol]
command=/opt/php83/bin/php /var/www/telegram.websol.uz/artisan queue:work --queue=telegramWebsol --sleep=3 --tries=3 --timeout=370 --max-time=3600
directory=/var/www/telegram.websol.uz
user=www-data
numprocs=4
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
; a process that opened a Telegram session exits after that job and is started again at once;
; startsecs=0 keeps such quick exits from counting as failed starts (FATAL after startretries)
startsecs=0
; SIGTERM: a send finishes the message in hand and goes back to the queue; a login step (120 s max) finishes
stopsignal=TERM
stopwaitsecs=130
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/telegram.websol.uz/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
